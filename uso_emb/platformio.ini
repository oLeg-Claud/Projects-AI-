; PlatformIO Project Configuration File for USO-32 (STM32G431KBU6 + ADS1262)
; Flash layout:
;   0x08000000 - 0x08007FFF : Bootloader (uso_bootloader, 32 KB)
;   0x08008000 - 0x0801F7FF : Main Application (uso_g431, 94 KB)
;   0x0801F800 - 0x0801FFFF : Image Metadata (2 KB)

[platformio]
default_envs = uso_g431, uso_bootloader

[common]
platform = ststm32@19.4.0
board = nucleo_g431kb
framework = stm32cube
extra_scripts = pre:scripts/usb_build.py
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Os
    -ffunction-sections
    -fdata-sections
    -DUSO_USB_VID=0x0483
    -DUSO_USB_PID=0x5740
    -Wl,--gc-sections
    -lm

[env:uso_g431]
extends = common
board_build.ldscript = linker/app.ld
build_src_filter = +<*> -<boot_*.c>
build_flags =
    ${common.build_flags}
    -DUSER_VECT_TAB_ADDRESS
    -DVECT_TAB_OFFSET=0x00008000U

[env:uso_nucleo_hsi]
extends = env:uso_g431

[env:uso_bootloader]
extends = common
board_build.ldscript = linker/boot.ld
build_src_filter = +<boot_*.c> +<board.c> +<usb_link.c> +<usbd_conf.c>
build_flags =
    ${common.build_flags}
    -DUSO_BOOTLOADER
